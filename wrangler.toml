name = "analytics-desk"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# The page, its script and styles. Requests that match no file (every /api route) run the Worker.
[assets]
directory = "./public"

# Five sign-in tries a minute per IP, per Cloudflare location.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "7301"
simple = { limit = 5, period = 60 }

# Workers AI: the free AI read, used when ANTHROPIC_API_KEY is not set. 10,000 free neurons a day per account;
# on the Workers Free plan it stops at that cap instead of billing.
[ai]
binding = "AI"

[observability]
enabled = true

# Settings and keys are secrets, not [vars], so this file stays the same for everyone.
# Fill .dev.vars from .dev.vars.example, then: npx wrangler secret bulk .dev.vars
